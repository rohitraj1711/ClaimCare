name: hospital_management
description: "Insurance Claim Management System - A production-grade Flutter Web application for managing hospital insurance claims."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  gap: ^3.0.1
  flutter_svg: ^2.0.9
  responsive_framework: ^1.1.1

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1

  # Data & Utils
  dio: ^5.4.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  formz: ^0.7.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
