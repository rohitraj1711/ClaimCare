name: hospital_management
description: "ClaimCare - Insurance Claim Management System for hospital claims."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
